# Azure Service Bus Emulator (Microsoft) ejecutado localmente mediante Docker.
# Basado en la plantilla oficial de Microsoft:
# https://github.com/Azure/azure-service-bus-emulator-installer
#
# Este archivo NO usa Azure real. Levanta dos contenedores locales:
#   1) emulator  -> mcr.microsoft.com/azure-messaging/servicebus-emulator (motor del emulador)
#   2) sqledge   -> mcr.microsoft.com/azure-sql-edge (estado interno que el emulador necesita)
#
# Las variables sensibles (contraseña local de SQL Edge) se leen desde un archivo
# .env local (ver .env.example en esta misma carpeta) y NUNCA se suben al repositorio.

name: microsoft-azure-servicebus-emulator

services:
  emulator:
    container_name: "servicebus-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "${CONFIG_PATH:-./config/Config.json}:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"   # AMQP - usado por @azure/service-bus (emisor y receptor)
      - "5300:5300"   # API HTTP interna del emulador
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
      ACCEPT_EULA: "${ACCEPT_EULA}"
    depends_on:
      - sqledge
    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"

  sqledge:
    container_name: "sqledge"
    image: "mcr.microsoft.com/azure-sql-edge:latest"
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    networks:
      sb-emulator:
        aliases:
          - "sqledge"

networks:
  sb-emulator:
